<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: lightgray;
        }
        div {
            font-family: Arial;
            padding: 10px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
    <script>
    function calc() {
        if (document.getElementById("quarters").value < 0) {
            document.getElementById("msg").innerHTML = "Quarters cannot be below zero";
            document.getElementById("ans").value = "";
        }
        if (document.getElementById("dimes").value < 0) {
            document.getElementById("msg").innerHTML = "Dimes cannot be below zero";
            document.getElementById("ans").value = "";
            
        }
        if (document.getElementById("nickels").value < 0) {
            document.getElementById("msg").innerHTML = "Nickels cannot be below zero";
            document.getElementById("ans").value = "";
		}
		if (document.getElementById("pennies").value == 12) {
            document.getElementById("msg").innerHTML = "CSS is watching you";
            document.getElementById("ans").value = "";
            return;
        }
        if (document.getElementById("pennies").value < 0) {
            document.getElementById("msg").innerHTML = "Pennies cannot be below zero";
            document.getElementById("ans").value = "";
            
        }
        if (document.getElementById("quarters").value > 10000 || document.getElementById("dimes").value > 10000 || document.getElementById("nickels").value > 10000 || document.getElementById("pennies").value > 10000) {
            document.getElementById("msg").innerHTML = "Too many coins";
            document.getElementById("ans").value = "";
            
        }

        document.getElementById("ans").value = (document.getElementById("quarters").value * 0.25 + document.getElementById("dimes").value * 0.10 + document.getElementById("nickels").value * 0.05 + document.getElementById("pennies").value * 0.01).toFixed(2);

        if (document.getElementById("ans").value < 1) {
            document.body.style.backgroundColor = "lightcoral";
            document.getElementById("msg").innerHTML = "You are broke";
        } else if (document.getElementById("ans").value < 10) {
            document.body.style.backgroundColor = "lightyellow";
            document.getElementById("msg").innerHTML = "You have some pocket change";
        } else {
            document.body.style.backgroundColor = "lightgreen";
            document.getElementById("msg").innerHTML = "You're rich";
        }

        document.getElementById("ans").value = "$" + document.getElementById("ans").value;
    }
    </script>
</head>
<body>
<h2>Check how much money you have</h2>
    <form>
        quarters: <input type="number" id="quarters" onchange="calc()" onkeyup="calc()"><br>
        dimes: <input type="number" id="dimes" onchange="calc()" onkeyup="calc()"><br>
        nickels: <input type="number" id="nickels" onchange="calc()" onkeyup="calc()"><br>
        pennies: <input type="number" id="pennies" onchange="calc()" onkeyup="calc()"><br>
        ans: <input id="ans"><br>
        <button onclick="calc(); return false">check</button>
    </form>
    <div id="msg"></div>
</body>
</html>
